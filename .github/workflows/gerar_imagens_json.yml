name: Gerar imagens.json

on:
  push:
    paths:
      - 'imagens/**'
      - 'gerar_imagens_json.py'
      - '.github/workflows/gerar_imagens_json.yml'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Gerar mapeamento de imagens
        run: python3 gerar_imagens_json.py

      - name: Commit imagens.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imagens.json
          git commit -m "Atualizar imagens.json automaticamente" || echo "Nada para commitar"
          git push
