name: Gerar Páginas dos Pokémon

on:
  push:
    paths:
      - 'pokemons.json'
      - 'template_pokemon.html'
      - 'gerar_paginas.py'
      - '.github/workflows/gerar_paginas.yml'

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Gerar páginas
        run: python3 gerar_paginas.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "Gerar páginas dos Pokémon automaticamente" || echo "Nada para commitar"
          git push
