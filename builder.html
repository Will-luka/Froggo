<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gâteau! - Builder</title>
    <link rel="icon" href="bolo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="builder.css">
    <link rel="stylesheet" href="custom-select.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">Gâteau<span>!</span></a>
            <nav class="main-nav" id="mainNav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
                    <li class="nav-item"><a href="artigos.html" class="nav-link">Artigos</a></li>
                    <li class="nav-item"><a href="sobre.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="contato.html" class="nav-link">Contato</a></li>
                </ul>
            </nav>
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
        </div>
    </header>

    <main class="container main-content">
        <h1 class="page-title">Oficina Tinkatink</h1>
<div class="builder-gif">
    <img src="https://media.tenor.com/oPEA9-M4Ia4AAAAM/pokemon-pokemon-horizons.gif" alt="Tinkatink" class="builder-gif-img">
</div>

<button id="btn-comparador" class="btn-load-more" style="display:block; margin:0 auto 2rem;">Comparador</button>

<div id="comparador-container" style="display:none; margin-bottom: 2rem;">
    <div class="comparador-lado" id="lado-a"></div>
    <div class="comparador-lado" id="lado-b"></div>
</div>
        <div class="builder-container">
            <!-- Painel de configuração -->
            <div class="builder-panel">
                <!-- Pokémon -->
                <div class="builder-group">
                    <label>Pokémon:</label>
                    <div class="custom-select" data-type="pokemon">
                        <div class="custom-select-trigger">
                            <img src="" alt="" class="custom-select-img" style="display:none;">
                            <span class="custom-select-text">-- Selecione --</span>
                        </div>
                        <div class="custom-select-options" style="display:none;"></div>
                    </div>
                </div>

                <!-- Nível -->
                <div class="builder-group">
                    <label for="level-select">Nível:</label>
                    <select id="level-select" class="builder-select"></select>
                </div>

                <!-- Held Item 1 -->
                <div class="builder-group">
                    <label>Held Item 1:</label>
                    <div class="custom-select" data-type="held1">
                        <div class="custom-select-trigger">
                            <img src="" alt="" class="custom-select-img" style="display:none;">
                            <span class="custom-select-text">-- Nenhum --</span>
                        </div>
                        <div class="custom-select-options" style="display:none;"></div>
                    </div>
                </div>

                <!-- Held Item 2 -->
                <div class="builder-group">
                    <label>Held Item 2:</label>
                    <div class="custom-select" data-type="held2">
                        <div class="custom-select-trigger">
                            <img src="" alt="" class="custom-select-img" style="display:none;">
                            <span class="custom-select-text">-- Nenhum --</span>
                        </div>
                        <div class="custom-select-options" style="display:none;"></div>
                    </div>
                </div>

                <!-- Held Item 3 -->
                <div class="builder-group">
                    <label>Held Item 3:</label>
                    <div class="custom-select" data-type="held3">
                        <div class="custom-select-trigger">
                            <img src="" alt="" class="custom-select-img" style="display:none;">
                            <span class="custom-select-text">-- Nenhum --</span>
                        </div>
                        <div class="custom-select-options" style="display:none;"></div>
                    </div>
                </div>

                <!-- Battle Item -->
                <div class="builder-group">
                    <label>Battle Item:</label>
                    <div class="custom-select" data-type="battle">
                        <div class="custom-select-trigger">
                            <img src="" alt="" class="custom-select-img" style="display:none;">
                            <span class="custom-select-text">-- Nenhum --</span>
                        </div>
                        <div class="custom-select-options" style="display:none;"></div>
                    </div>
                </div>
            </div>

            <!-- Painel de resultados -->
            <div class="results-panel" id="results-panel">
                <p class="results-placeholder">Selecione um Pokémon para ver os resultados.</p>
            </div>
        </div>

        <!-- Descrições dos itens selecionados -->
        <div class="item-desc-container" id="item-desc"></div>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <p class="copyright">&copy; 2025 Gâteau! Todos os direitos reservados.</p>
            <div class="social-links">
                <a href="#" class="social-link">Twitter</a>
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Instagram</a>
            </div>
        </div>
    </footer>

    <button id="backToTopBtn" class="back-to-top" aria-label="Voltar ao topo">↑</button>

    <script src="script.js"></script>
    <script src="custom-select.js"></script>
    <script src="builder.js"></script>
</body>
</html>
